<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>LIVE秘書</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>LIVE SECRETARY / MOCK MODE</small><h1>配信を、ひとりで回さない。</h1><p>コメントが止まった時だけ、会話のきっかけを作る配信秘書。</p></div><span id="status">待機中</span></header><section class="panel"><h2>今日の配信</h2><label>配信モード<select id="mode"><option>雑談</option><option>まったり</option><option>恋バナ</option><option>深夜</option><option>初見歓迎</option><option>わちゃわちゃ</option></select></label><label>秘書の性格<select id="persona"><option>関西ツッコミ</option><option>しっかり秘書</option><option>毒舌</option><option>ふわふわ</option><option>執事</option></select></label><label>介入度<select id="level"><option value="normal">普通</option><option value="low">控えめ</option><option value="high">積極的</option></select></label><label>今日話したいこと<input id="topic" placeholder="例：最近ハマってるもの"></label><button id="start">配信シミュレーション開始</button></section><section class="panel live"><div class="row"><div><small>視聴者</small><b id="viewers">6</b></div><div><small>沈黙</small><b><span id="silence">0</span>秒</b></div><div><small>コメント</small><b id="comments">0</b></div></div><div id="feed" aria-live="polite"><p class="bot">秘書：配信開始を待っています。</p></div><div class="actions"><button id="comment" disabled>💬 コメント発生</button><button id="newcomer" disabled>＋ 初見入室</button><button id="skip" disabled>⏱ 30秒進める</button></div></section><section class="panel"><h2>秘書機能</h2><div class="toggles"><label><input type="checkbox" checked data-feature="prompt">コメント促進</label><label><input type="checkbox" checked data-feature="psych">心理テスト</label><label><input type="checkbox" checked data-feature="topic">話題提供</label><label><input type="checkbox" checked data-feature="new">初見サポート</label></div></section><footer>Spoon API未接続 — 9/30公開仕様に合わせて接続層を追加予定</footer></main><script src="app.js"></script></body></html>
